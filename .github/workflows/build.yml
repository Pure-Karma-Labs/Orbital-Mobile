name: Build

on:
  push:
    branches: [main]
    paths:
      - 'packages/orbital-signal/**'
      - 'packages/orbital-media-transcoder/android/**'
      - 'packages/orbital-media-transcoder/package.json'
      - 'packages/orbital-media-transcoder/src/NativeOrbitalMediaTranscoder.ts'
      - 'android/**'
      - 'ios/**'
      - 'src/config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/build.yml'
      - 'scripts/verify-rust-profile-ios.sh'
      - 'scripts/test-rust-profile-gate-ios.sh'
      - 'scripts/test-rust-profile-gate-android.sh'
      - 'scripts/rust-gate-probe.init.gradle'
  pull_request:
    paths:
      - 'packages/orbital-signal/**'
      - 'packages/orbital-media-transcoder/android/**'
      - 'packages/orbital-media-transcoder/package.json'
      - 'packages/orbital-media-transcoder/src/NativeOrbitalMediaTranscoder.ts'
      - 'android/**'
      - 'ios/**'
      - 'src/config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/build.yml'
      - 'scripts/verify-rust-profile-ios.sh'
      - 'scripts/test-rust-profile-gate-ios.sh'
      - 'scripts/test-rust-profile-gate-android.sh'
      - 'scripts/rust-gate-probe.init.gradle'
  # workflow_dispatch lets us manually trigger build jobs on this branch to
  # verify the hosted-runner migration before it merges to main.
  workflow_dispatch:

# Build jobs only need checkout + cache access; keep the GITHUB_TOKEN
# read-only like ci.yml and security.yml.
permissions:
  contents: read
  # dorny/paths-filter queries the PR changed-files API on pull_request events
  pull-requests: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate job: detect changes to the Rust surface (used by rust-apple-targets).
  # The workflow-level `paths:` filter is deliberately broader than the Rust
  # crate (it also covers android/, ios/, package.json), so a second, narrower
  # filter keeps the macOS-minute cost of rust-apple-targets off PRs that only
  # touch the app.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Rust Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Paths filter
        id: filter
        # SHA-pinned: 7b450fff21473bca461d4b92ce414b9d0420d706 = v4.0.2
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'packages/orbital-signal/rust/**'
              - 'packages/orbital-signal/ubrn.config.yaml'
              - 'rust-toolchain.toml'
              - '.github/workflows/build.yml'

  # ---------------------------------------------------------------------------
  # Apple-target Rust cross-compile gate (issue #634, DEBT-160).
  #
  # Why this exists: build-ios below is main/dispatch-only, and ci.yml's
  # Podfile.lock check only fires on package.json / ios/** / *.podspec. Before
  # this job, a Rust-only PR compiled the crate for NO Apple target anywhere in
  # PR CI — security.yml's rust-test is x86_64-unknown-linux-gnu on ubuntu, which
  # cannot catch an aarch64-apple-ios link failure or an Apple-specific SIMD
  # backend problem in libcrux. That hole recurred on every libsignal bump
  # (#309, #624, #634).
  #
  # Deliberately NOT a full Xcode/xcframework build — that is build-ios's job.
  # This catches Rust link failures and target-specific codegen problems at a
  # fraction of the cost. x86_64-apple-ios stays local-only (V-13); it is the
  # simulator-on-Intel slice and shares its backend selection with
  # x86_64-linux-android, which build-android already compiles on every PR.
  # ---------------------------------------------------------------------------
  rust-apple-targets:
    name: Rust Apple Targets (cross-compile)
    runs-on: macos-latest
    timeout-minutes: 45
    needs: changes
    # always() is required: without it, a FAILED changes job makes GitHub skip
    # this job without evaluating the if-expression at all — the Apple-target
    # gate would silently disappear while the workflow stays green.
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.rust == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # libsignal's spqr dependency has a build.rs that invokes protoc.
      # Same pinned version + digest as build-android / build-ios below.
      - name: Cache protoc 34.1
        id: protoc-cache
        uses: actions/cache@v6
        with:
          path: ~/protoc-34.1
          key: protoc-34.1-${{ runner.os }}

      - name: Install protoc 34.1
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          # Digest: official protocolbuffers/protobuf v34.1 release asset
          # https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-universal_binary.zip
          # (protobuf publishes no SHA256SUMS.) To update on a version bump,
          # re-derive — do NOT copy the old hash forward:
          #   curl -fsSL <new-asset-url> -o protoc.zip && shasum -a 256 protoc.zip
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-universal_binary.zip" -o protoc.zip
          echo "5c6057638aa382542e75f1c5a0802893e2311ad0c8b689e635dd4ac3c9eb8169  protoc.zip" | shasum -a 256 -c -
          unzip protoc.zip -d ~/protoc-34.1
          rm protoc.zip

      - name: Add protoc to PATH
        run: |
          echo "$HOME/protoc-34.1/bin" >> "$GITHUB_PATH"
          "$HOME/protoc-34.1/bin/protoc" --version

      # rustup reads rust-toolchain.toml on the first cargo invocation and
      # auto-downloads the pinned toolchain; adding the targets up front makes
      # them available before that first run.
      - name: Setup Rust
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      # Distinct shared-key: this job builds different targets than
      # rust-build-ios (no xcframework, no x86_64 slice), so sharing that cache
      # would thrash it.
      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/orbital-signal/rust/orbital_signal
          shared-key: rust-pr-apple
          # Only save from main to avoid cache thrash across PR branches.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --release on the device slice deliberately. The dev profile is NOT the
      # codegen path that ships: [profile.release] sets lto = "thin",
      # codegen-units = 1, strip = "symbols" and overflow-checks = true, and
      # since #634 that profile compiles stock curve25519-dalek 5.0.0's
      # Edwards/XEdDSA arithmetic under LTO for the first time. A dev-only
      # cross-compile would not link-test any of that. The sim slice stays on
      # dev to keep the job fast — it exists to catch target-specific
      # (SIMD/intrinsic) breakage, which the dev profile surfaces fine.
      - name: Cross-compile aarch64-apple-ios (device, release profile)
        working-directory: packages/orbital-signal/rust/orbital_signal
        run: cargo build --release --target aarch64-apple-ios

      - name: Cross-compile aarch64-apple-ios-sim (Apple Silicon simulator)
        working-directory: packages/orbital-signal/rust/orbital_signal
        run: cargo build --target aarch64-apple-ios-sim

  build-android:
    name: Android Debug Build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The hosted macOS runner (macos-latest = macos-26) ships NDK 27.3 as
      # its default, but android/build.gradle pins ndkVersion to 27.1.12297006
      # (the version used during initial development). Install the exact minor
      # version so both the Gradle AGP resolution and the ANDROID_NDK_HOME env
      # for cargo-ndk point to the same directory. NDK downloads are cached
      # so only the first cold run incurs the ~1 GB download.
      # Note: ANDROID_HOME is pre-set by the hosted runner image.
      - name: Cache Android NDK 27.1.12297006
        id: ndk-cache
        uses: actions/cache@v6
        with:
          path: ~/Library/Android/sdk/ndk/27.1.12297006
          key: android-ndk-27.1.12297006-${{ runner.os }}

      - name: Install Android NDK 27.1.12297006
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # libsignal's spqr dependency (SparsePostQuantumRatchet) has a build.rs
      # that invokes protoc at Rust compile time to generate protobuf bindings.
      # The self-hosted Mac had protoc pre-installed; hosted runners do not.
      - name: Cache protoc 34.1
        id: protoc-cache
        uses: actions/cache@v6
        with:
          path: ~/protoc-34.1
          key: protoc-34.1-${{ runner.os }}

      - name: Install protoc 34.1
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          # Digest: official protocolbuffers/protobuf v34.1 release asset
          # https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-universal_binary.zip
          # (protobuf publishes no SHA256SUMS.) To update on a version bump,
          # re-derive — do NOT copy the old hash forward:
          #   curl -fsSL <new-asset-url> -o protoc.zip && shasum -a 256 protoc.zip
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-universal_binary.zip" -o protoc.zip
          echo "5c6057638aa382542e75f1c5a0802893e2311ad0c8b689e635dd4ac3c9eb8169  protoc.zip" | shasum -a 256 -c -
          unzip protoc.zip -d ~/protoc-34.1
          rm protoc.zip

      - name: Add protoc to PATH
        run: |
          echo "$HOME/protoc-34.1/bin" >> "$GITHUB_PATH"
          "$HOME/protoc-34.1/bin/protoc" --version

      # GitHub-hosted runners have Rust pre-installed (currently 1.96.0) but
      # rust-toolchain.toml pins 1.94.1. rustup reads rust-toolchain.toml on
      # first cargo invocation and auto-downloads the pinned toolchain. The
      # explicit target additions below mirror the toml entries and ensure
      # targets are available before the first cargo run in the workspace.
      - name: Setup Rust
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk@4.1.2 --locked 2>/dev/null || true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets
        run: |
          cat > .env <<'ENVEOF'
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          API_URL=${{ secrets.API_URL }}
          ENVEOF

      - name: Inject google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      # Issue #510: on main, this step's `Post` phase uploads the (already
      # rust-cache-pruned) target/ dir, which took 13+ min per push even on
      # merges that didn't touch the crate (~half of them). A cheap
      # lookup-only pass first checks whether an exact-match cache entry
      # already exists for this key (Cargo.lock/rust-toolchain.toml hash +
      # the rust-build-android shared-key) without downloading anything; the
      # real restore step below skips its save when that lookup hits.
      - name: Rust cache lookup (android)
        id: rust-cache-lookup-android
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/orbital-signal/rust/orbital_signal
          shared-key: rust-build-android
          lookup-only: true

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/orbital-signal/rust/orbital_signal
          # Does not encode Rust profile — split key if a release build step is ever added.
          shared-key: rust-build-android
          # save-if can't reference this same step's own cache-hit output
          # (with: inputs are evaluated before the step runs), hence the
          # separate lookup-only step above. PR restore-only behavior (#310)
          # is unchanged: save-if is false on PRs regardless of the lookup.
          save-if: ${{ github.ref == 'refs/heads/main' && steps.rust-cache-lookup-android.outputs.cache-hit != 'true' }}

      - name: Build Rust for Android
        run: |
          cd packages/orbital-signal
          npm run build:android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Gradle dependency cache: caches downloaded JARs (~300 MB typical for
      # this project) so they are not re-downloaded on every cold hosted-runner
      # boot. The full build-output cache (~6 GB with all intermediate
      # compiled artifacts) is still omitted — that volume causes 0 MB/s stalls
      # when uploading to GitHub's cache service.
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/app/build.gradle', 'packages/orbital-media-transcoder/android/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Android Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      # Must stay after assembleDebug: needs the debug-profile Rust binaries +
      # marker it produces. The harness starts its own Gradle daemon (scoped to
      # this step) and stops it via the trap in the script.
      - name: Test Rust release-profile gate (issue #550)
        run: bash scripts/test-rust-profile-gate-android.sh
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'

  # Validates the gate's bash logic (scripts/verify-rust-profile-ios.sh) and
  # Podfile wiring on every PR. The Xcode -> /bin/sh -> exec bash delegation in
  # project.pbxproj is deliberately NOT exercised here — that path runs in the
  # build-ios job on main pushes (PR #556 review: accepted tradeoff).
  test-rust-gate-ios:
    name: iOS Rust Profile Gate Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Test iOS release-profile gate (issue #550)
        run: bash scripts/test-rust-profile-gate-ios.sh

  build-ios:
    name: iOS Debug Build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Select the newest Xcode 26.x on the image rather than hard-coding a
      # minor version: runner images periodically drop older minors, and a
      # hard-coded path would also break when macos-latest rolls to macos-27.
      # If no 26.x exists at all, fail loudly here rather than mid-build. The
      # Podfile post_install hook patches fmt/base.h to disable a
      # false-positive consteval error introduced in Xcode 26's Apple Clang
      # build (see ios/Podfile); the patch targets all Apple Clang versions
      # and is forward-compatible within the 26.x series.
      - name: Select Xcode (newest 26.x)
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selected $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      # libsignal's spqr dependency (SparsePostQuantumRatchet) has a build.rs
      # that invokes protoc at Rust compile time to generate protobuf bindings.
      # The self-hosted Mac had protoc pre-installed; hosted runners do not.
      - name: Cache protoc 34.1
        id: protoc-cache
        uses: actions/cache@v6
        with:
          path: ~/protoc-34.1
          key: protoc-34.1-${{ runner.os }}

      - name: Install protoc 34.1
        if: steps.protoc-cache.outputs.cache-hit != 'true'
        run: |
          # Digest: official protocolbuffers/protobuf v34.1 release asset
          # https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-universal_binary.zip
          # (protobuf publishes no SHA256SUMS.) To update on a version bump,
          # re-derive — do NOT copy the old hash forward:
          #   curl -fsSL <new-asset-url> -o protoc.zip && shasum -a 256 protoc.zip
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protoc-34.1-osx-universal_binary.zip" -o protoc.zip
          echo "5c6057638aa382542e75f1c5a0802893e2311ad0c8b689e635dd4ac3c9eb8169  protoc.zip" | shasum -a 256 -c -
          unzip protoc.zip -d ~/protoc-34.1
          rm protoc.zip

      - name: Add protoc to PATH
        run: |
          echo "$HOME/protoc-34.1/bin" >> "$GITHUB_PATH"
          "$HOME/protoc-34.1/bin/protoc" --version

      # GitHub-hosted runners have Rust pre-installed (currently 1.96.0) but
      # rust-toolchain.toml pins 1.94.1. rustup reads rust-toolchain.toml on
      # first cargo invocation and auto-downloads the pinned toolchain. The
      # explicit target additions below mirror the toml entries and ensure
      # targets are available before the first cargo run in the workspace.
      - name: Setup Rust
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets
        run: |
          cat > .env <<'ENVEOF'
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          API_URL=${{ secrets.API_URL }}
          ENVEOF

      - name: Inject GoogleService-Info.plist
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/OrbitalMobile/GoogleService-Info.plist

      # Issue #510: see the matching comment in build-android above. Same
      # lookup-only-then-restore pattern, keyed on the ios shared-key so the
      # android/ios caches never clobber each other.
      - name: Rust cache lookup (ios)
        id: rust-cache-lookup-ios
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/orbital-signal/rust/orbital_signal
          shared-key: rust-build-ios
          lookup-only: true

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: packages/orbital-signal/rust/orbital_signal
          # Does not encode Rust profile — split key if a release build step is ever added.
          shared-key: rust-build-ios
          save-if: ${{ github.ref == 'refs/heads/main' && steps.rust-cache-lookup-ios.outputs.cache-hit != 'true' }}

      - name: Build Rust for iOS
        run: |
          cd packages/orbital-signal
          npm run build:ios

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Detect iOS Simulator
        id: simulator
        run: |
          # Pick the first available iPhone simulator
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            if 'iOS' in runtime:
              for d in devices:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(d['name']); sys.exit()
          print('iPhone 17 Pro')  # fallback
          ")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"

      - name: Build iOS Debug
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/OrbitalMobile.xcworkspace \
            -scheme OrbitalMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log | tail -50
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
