name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter queries the PR changed-files API on pull_request events
  pull-requests: read

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    runs-on: macos-latest
    # 40, not 30: typical runs are 20-23 min (ESLint, tsc, 161 Jest suites, pod
    # install, iOS compile gate). A slow runner reached 29m13s (transcoder
    # xcodebuild 18m57s). Since #768 a Sentry-cache miss adds a 66 MB download.
    # Since #769 the budget includes the Firebase SPM verifier harness (seconds),
    # the Package.resolved gate (~10 s hit / 2-4 min miss), the SPM cache save
    # on a miss (compress+upload ~1.2 GB, est. 2-3 min), and the OrbitalSignal
    # delta in the compile step (est. 1-3 min). One hung suite (#731) consumed
    # the whole budget and cancelled a job whose other 160 suites had already
    # passed -- a flake shouldn't discard passing work. If runs approach 40,
    # split the transcoder compile into its own job rather than raising this
    # again (tracked on #769).
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Create .env from secrets
        run: |
          cat > .env <<'ENVEOF'
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          API_URL=${{ secrets.API_URL }}
          ENVEOF

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Jest tests
        run: npm test -- --ci --coverage

      # ---------------------------------------------------------------------
      # Issue #598: catch emoji asset regeneration drift.
      #
      # generate:emoji is pure Node + sharp (a devDependency already installed
      # by npm ci above). It reads emoji-datasource and openmoji SVGs, then
      # writes assets/emoji/*.webp and src/emoji/assetMap.ts.
      #
      # We intentionally do NOT diff the binary .webp contents: sharp/libvips
      # re-encodes SVGs to WebP and the exact byte sequence varies across
      # libvips versions pinned in different runner images. Diffing binary
      # output would produce false positives (runner image update => CI red)
      # without catching any real drift. The meaningful drift classes are:
      #   (a) the codegen'd TypeScript map changes (wrong keys, wrong paths)
      #   (b) a different number of assets is produced (missing/extra emoji)
      # Both are caught without touching binary content.
      # Gated to changes that can actually cause drift (generator, emoji
      # data/map, deps, or the assets themselves) so unrelated PRs don't pay
      # the ~1min sharp rasterization cost. Mirrors the pod-filter pattern
      # below. Push builds on main always run it (event gate on the filter).
      - name: Emoji drift filter
        id: emoji-filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            emoji:
              - 'scripts/generate-emoji-assets.mjs'
              - 'src/emoji/**'
              - 'assets/emoji/**'
              - 'package.json'
              - 'package-lock.json'

      - name: Emoji asset drift check
        if: github.event_name != 'pull_request' || steps.emoji-filter.outputs.emoji == 'true'
        run: |
          npm run generate:emoji
          # (a) Map text must be unchanged — catches codegen/key-naming drift
          git diff --exit-code src/emoji/assetMap.ts
          # (b) Asset file count must match map entry count — catches
          #     missing/extra emoji without diffing binary WebP content.
          EXPECTED=$(grep -c "require(" src/emoji/assetMap.ts)
          ACTUAL=$(ls assets/emoji/*.webp 2>/dev/null | wc -l | tr -d ' ')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: asset count mismatch — assetMap.ts has $EXPECTED entries, assets/emoji/ has $ACTUAL files"
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Issue #513: catch native-dependency lockfile drift on PRs.
      #
      # build.yml's iOS Debug Build (which runs a real `pod install`) is
      # gated to main-only pushes because it's expensive. That left a gap:
      # PRs bumping a native module (e.g. #505, where @sentry/react-native
      # 8.17.2's RNSentry.podspec pinned an exact Sentry version that
      # conflicted with the committed ios/Podfile.lock) could merge to main
      # and only fail there. CocoaPods reported that conflict as a
      # deployment-target error, not a version-pin error, making it doubly
      # confusing post-merge.
      #
      # A text diff of Podfile.lock can't catch this class of bug -- the
      # conflict comes from evaluating third-party podspecs (which can
      # pin/require versions independent of what's committed), not from the
      # lockfile alone. `pod install --deployment` is the real dependency
      # resolver in read-only/verify mode: it fails without mutating
      # Podfile.lock if the Podfile/podspecs and the committed lockfile
      # disagree. (`pod check` does not exist in modern CocoaPods.)
      #
      # Gated to PRs that touch package.json or ios/** so it doesn't run on
      # every PR -- pod resolution isn't affected by anything else in the
      # repo.
      - name: Podfile.lock consistency filter
        id: pod-filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ios-native:
              - 'package.json'
              - 'package-lock.json'   # caret-ranged native deps can move on the lock alone (#667)
              - 'ios/**'
              - 'packages/orbital-signal/*.podspec'
              - 'packages/orbital-media-transcoder/*.podspec'
              - 'packages/orbital-media-transcoder/ios/**'
              - 'packages/orbital-media-transcoder/src/Native*.ts'
              - '.github/workflows/ci.yml'                        # edits to this gate must exercise the gate (#767)
              - 'scripts/assert-no-absolute-pod-paths.sh'         # #767
              - 'scripts/test-assert-no-absolute-pod-paths.sh'    # #767
              - 'scripts/verify-firebase-spm.rb'                  # #769
              - 'scripts/test-verify-firebase-spm.sh'             # #769
              - 'scripts/fixtures/firebase-spm/**'                # #769

      - name: Cache CocoaPods
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'ios/Podfile') }}
          restore-keys: |
            pods-${{ runner.os }}-

      # Issue #767/#768: RNSentry downloads Sentry.xcframework.zip into this dir
      # and symlinks Pods/sentry-xcframeworks/<ver> into it. Own cache entry,
      # keyed on the installed podspec + helper (sentry-cocoa version and
      # checksum table), NO restore-keys: a cached tree is never inherited across
      # versions. Do not pre-create the dir: an empty entry under this key would
      # be hit forever. The ios/Pods cache carries the symlink, and on a miss
      # here the podspec re-downloads during resolution so the two caches cannot
      # get out of step. Keep this step identical in build.yml.
      - name: Cache Sentry xcframework download
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/sentry-react-native
          key: sentry-xcframework-${{ runner.os }}-${{ hashFiles('node_modules/@sentry/react-native/RNSentry.podspec', 'node_modules/@sentry/react-native/scripts/sentry_utils.rb') }}

      # Issue #769: Xcode resolves the firebase-ios-sdk Swift package (13 repos,
      # ~1.2 GB incl. every binaryTarget zip in the graph, grpc-binary alone
      # 609 MB) before it can build any target that shares the workspace.
      # Keyed on the committed pin so a bump gets a fresh resolve; restore-keys
      # lets Xcode reuse unchanged mirrors on a miss. Keep path/key identical
      # in build.yml (enforced by the cache-parity rule in
      # scripts/check-security-invariants.mjs).
      - name: Cache Swift package clones
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/orbital-spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/OrbitalMobile.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # `pod install` evaluates the Podfile and every dependency's podspec as
      # arbitrary Ruby. On GitHub-hosted ephemeral runners this is safe --
      # the VM is discarded after the job, so fork PRs cannot exfiltrate
      # secrets or persist changes to the host machine. (Issue #479 migrated
      # this job to GitHub-hosted runners specifically to close that attack
      # surface before the repo goes public.)
      # Issue #767: fixture harness for scripts/assert-no-absolute-pod-paths.sh,
      # run on this macOS runner's BSD grep before the real assertion below so a
      # vacuous or broken pattern can never pass silently. Needs no Pods/.
      - name: Self-test the pod-path assertion (issue #767)
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        run: bash scripts/test-assert-no-absolute-pod-paths.sh

      # Issue #769: fixture harness for scripts/verify-firebase-spm.rb, run on
      # this macOS runner's system Ruby before the real guard runs from the
      # Podfile post_integrate hook. Needs no ios/ files.
      - name: Self-test the Firebase SPM verifier (issue #769)
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        run: bash scripts/test-verify-firebase-spm.sh

      - name: Podfile.lock consistency check
        id: pod-install
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        working-directory: ios
        shell: bash   # explicit bash => pipefail, so a pod failure is not masked by tee
        run: pod install --deployment 2>&1 | tee pod-install.log

      # Issue #769 (guard 3 of 3). Two independent signals that Firebase resolved
      # via SPM, plus a same-run pbxproj diff:
      #   (a) firebase_spm.rb prints "Using SPM for Firebase dependency resolution"
      #       once per firebase_dependency call that takes the SPM branch. Measured:
      #       6 per install on CocoaPods 1.17.0 (RNFBApp + RNFBMessaging, three
      #       podspec evaluations each; probe-pod-install-{2,4,9}.log). Assert >= 2
      #       (both pods at least once) so that an upstream reword is loud rather
      #       than silent; the CocoaPods-branch check below is the second signal.
      #   (b) the committed app project must be byte-identical after `pod install`.
      #       RNFB writes the package reference AFTER the Podfile's post_integrate
      #       hook (it wraps run_podfile_post_integrate_hooks), so the Podfile's
      #       guard 2 is a next-run tripwire; this diff is the same-run one.
      - name: Assert Firebase resolves via SPM (issue #769)
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        working-directory: ios
        shell: bash
        run: |
          # firebase_spm.rb prints this once per firebase_dependency call that takes
          # the SPM branch. Measured: 6 per install on CocoaPods 1.17.0 (RNFBApp +
          # RNFBMessaging, three podspec evaluations each; probe-pod-install-{2,4,9}.log).
          # Assert >= 2 (both pods at least once) and that the CocoaPods branch never
          # printed; the committed pbxproj is the structural second signal (guard 2).
          if [ "$(grep -c -F 'Using SPM for Firebase dependency resolution' pod-install.log)" -lt 2 ]; then
            echo "ERROR: expected RNFBApp and RNFBMessaging to resolve Firebase via SPM (#769)."
            echo "Either the Podfile lost 'use_frameworks! :linkage => :dynamic' / regained"
            echo "\$RNFirebaseDisableSPM (Podfile guard 1 should have failed first), or upstream"
            echo "reworded the log line in node_modules/@react-native-firebase/app/firebase_spm.rb."
            exit 1
          fi
          if grep -F 'SPM disabled' pod-install.log; then
            echo "ERROR: react-native-firebase took the CocoaPods branch (#769)."; exit 1
          fi
          if ! git diff --exit-code -- OrbitalMobile.xcodeproj/project.pbxproj; then
            echo "ERROR: pod install modified the committed app project (#769)."
            echo "The committed pbxproj already carries the firebase-ios-sdk package reference (exactVersion),"
            echo "the FirebaseCore product dependency and the [RNFB] phases; every pod install must be a"
            echo "no-op on it. A diff means RNFB or RN changed what they write — run pod install locally"
            echo "from the main checkout, inspect, and commit the result deliberately."
            exit 1
          fi

      # ---------------------------------------------------------------------
      # Issue #767 (1 of 2): fail loudly if RNSentry fell back to an absolute
      # cache path. Rationale and pattern live in
      # scripts/assert-no-absolute-pod-paths.sh (one home; #768's Podfile guard
      # is the same-run Ruby side). The harness runs first, on this macOS
      # runner's BSD grep, so a vacuous pattern can never pass silently; it
      # sits BEFORE `pod install` because it needs no Pods/ and must run even
      # when the install fails.
      # Runs even when `pod install --deployment` failed (!cancelled()): a leak
      # makes deployment mode die with an opaque lockfile-checksum diff after
      # the podspec JSON is on disk, and the script still names the cause.
      - name: Assert no absolute paths in the pod graph (issue #767)
        if: ${{ github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true' && !cancelled() }}
        env:
          POD_INSTALL_OUTCOME: ${{ steps.pod-install.outcome }}
        run: bash scripts/assert-no-absolute-pod-paths.sh

      # Issue #767 (2 of 2): the committed lockfile must be byte-identical after
      # `pod install`. --deployment stops the resolver writing Podfile.lock (and
      # already rejects a COCOAPODS-stamp drift as a lockfile change), but
      # Podfile hooks and CocoaPods plugins run after that check and can still
      # touch it. project.pbxproj is diffed by the #769 step above with an
      # SPM-specific message; build.yml carries both diffs because it has no
      # #769 step.
      - name: Assert pod install left the tree clean (issue #767)
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        working-directory: ios
        shell: bash
        run: |
          if ! git diff --exit-code -- Podfile.lock; then
            echo "ERROR: pod install modified the committed ios/Podfile.lock (#767)."
            echo "--deployment forbids resolver changes, so this came from a Podfile hook or a"
            echo "CocoaPods plugin. If the only change is a SPEC CHECKSUM, a podspec evaluated"
            echo "differently on this runner than on the machine that committed the lock."
            exit 1
          fi

      # Issue #769: the Firebase version gate. `pod install --deployment` no
      # longer sees Firebase (it is a Swift package). The exact pin is the
      # exactVersion requirement in the app pbxproj, resolved into the committed
      # Package.resolved (both verified by scripts/verify-firebase-spm.rb from
      # the Podfile). Verified on Xcode 27.0 (2026-09-16, five scenarios):
      # -disableAutomaticPackageResolution makes this command RESOLVE (it lists
      # the packages) and exit 0 without touching Package.resolved when the pins
      # satisfy the requirements, exit 74 "Could not resolve package
      # dependencies" when a pin is outside the requirement, and never rewrite
      # the file (SwiftPM's lock-file strategy neither computes originHash nor
      # saves). The diff below is the backstop. A cache hit costs seconds; a
      # miss is the full ~1.2 GB fetch (~2 min measured).
      - name: Assert Package.resolved satisfies the Firebase requirement (issue #769)
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        working-directory: ios
        shell: bash
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace OrbitalMobile.xcworkspace \
            -scheme OrbitalMobile \
            -disableAutomaticPackageResolution \
            -clonedSourcePackagesDirPath ~/Library/Caches/orbital-spm
          if ! git diff --exit-code -- OrbitalMobile.xcworkspace/xcshareddata/swiftpm/Package.resolved; then
            echo "ERROR: package resolution changed the committed Package.resolved (#769)."
            exit 1
          fi

      # Issue #586 / #769: PR-time compile of the two first-party pods. Must go
      # through the workspace (a package-bearing Pods.xcodeproj cannot be built
      # with -project: "Packages are not supported when using legacy build
      # locations"). ◆ OrbitalSignal is added (rust review): it now links the
      # vendored Rust archive at its own link step and had zero PR-time coverage.
      # Both schemes share one DerivedData, so the second build is the delta only.
      - name: Compile OrbitalMediaTranscoder + OrbitalSignal (PR-time iOS gate)
        if: github.event_name == 'pull_request' && steps.pod-filter.outputs.ios-native == 'true'
        working-directory: ios
        run: |
          for SCHEME in OrbitalMediaTranscoder OrbitalSignal; do
            xcodebuild \
              -workspace OrbitalMobile.xcworkspace \
              -scheme "$SCHEME" \
              -sdk iphonesimulator \
              -configuration Debug \
              -derivedDataPath "$RUNNER_TEMP/dd" \
              -clonedSourcePackagesDirPath ~/Library/Caches/orbital-spm \
              -disableAutomaticPackageResolution \
              build \
              CODE_SIGNING_ALLOWED=NO
          done
